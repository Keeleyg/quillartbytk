name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # GitHub Pages intermittently returns "Deployment failed, try again later" for
  # a few minutes at a time. These jobs re-run the deploy with increasing backoff
  # so a publish self-heals across a transient outage — no manual re-run needed.
  # Each is skipped when a previous attempt already succeeded, so on a healthy
  # deploy they cost nothing. Attempts land at ~0, ~2 and ~7 minutes.
  deploy-retry-1:
    needs: deploy
    if: failure()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait before retrying (attempt 2 of 3)
        run: sleep 120
      - id: deployment
        uses: actions/deploy-pages@v5

  deploy-retry-2:
    needs: deploy-retry-1
    if: failure()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait before retrying (attempt 3 of 3)
        run: sleep 300
      - id: deployment
        uses: actions/deploy-pages@v5
