name = "quillartbytk-api"
main = "src/index.ts"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

# TODO: After running `wrangler login`, fill in account_id.
# Find it in the Cloudflare dashboard sidebar (right side of any zone page).
# account_id = "xxxxxxxxxxxxxxxxxxxx"

# Route the Worker at /api/* on the production domain.
# Requires the quillartbytk.com zone to be on this Cloudflare account
# with the orange-cloud proxy enabled on the apex DNS record.
[[routes]]
pattern = "quillartbytk.com/api/*"
zone_name = "quillartbytk.com"

[[routes]]
pattern = "www.quillartbytk.com/api/*"
zone_name = "quillartbytk.com"

# KV namespace holding item reservations (the "seat map").
# id is filled in by `wrangler kv namespace create RESERVATIONS`.
[[kv_namespaces]]
binding = "RESERVATIONS"
id = "7ae0a07718524edf877147c1944da445"
